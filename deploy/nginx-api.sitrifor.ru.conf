# sitrifor API — шаблон для api.sitrifor.ru (НЕ АКТИВИРОВАТЬ до запуска backend)
#
# Когда backend будет готов на 127.0.0.1:8081:
#   1. DNS: A-запись api.sitrifor.ru → IP сервера
#   2. sudo cp deploy/nginx-api.sitrifor.ru.conf /etc/nginx/sites-available/api.sitrifor.ru
#   3. sudo ln -sf /etc/nginx/sites-available/api.sitrifor.ru /etc/nginx/sites-enabled/
#   4. sudo nginx -t && sudo systemctl reload nginx
#   5. sudo certbot --nginx -d api.sitrifor.ru

server {
    listen 80;
    listen [::]:80;
    server_name api.sitrifor.ru;

    client_max_body_size 16m;

    location / {
        proxy_pass http://127.0.0.1:8081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
    }
}

# После выпуска TLS (certbot):
# server {
#     listen 443 ssl http2;
#     listen [::]:443 ssl http2;
#     server_name api.sitrifor.ru;
#     ...
# }
