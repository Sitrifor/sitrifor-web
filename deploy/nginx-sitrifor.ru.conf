# sitrifor.ru — статический сайт (лендинг)
# Установка:
#   sudo cp /var/www/sitrifor/deploy/nginx-sitrifor.ru.conf /etc/nginx/sites-available/sitrifor.ru
#   sudo ln -sf /etc/nginx/sites-available/sitrifor.ru /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
# TLS:
#   sudo certbot --nginx -d sitrifor.ru -d www.sitrifor.ru
#
# Чистые URL: /exclusive вместо /exclusive.html
# Старые ссылки *.html редиректятся 301 на без расширения.
#
# Примечание: после certbot SSL-блоки (listen 443 + сертификаты)
# добавляются в /etc/nginx/sites-available/sitrifor.ru — этот файл
# описывает логику маршрутизации (HTTP→apex, www→apex, SEO redirects).

# HTTP → HTTPS apex (www и apex)
server {
    listen 80;
    listen [::]:80;
    server_name sitrifor.ru www.sitrifor.ru;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        allow all;
    }

    location / {
        return 301 https://sitrifor.ru$request_uri;
    }
}

# www HTTPS → apex HTTPS
# (ssl_* строки появятся после certbot / копирования из live-конфига)
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.sitrifor.ru;

    # ssl_certificate /etc/letsencrypt/live/sitrifor.ru/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/sitrifor.ru/privkey.pem;
    # include /etc/letsencrypt/options-ssl-nginx.conf;
    # ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://sitrifor.ru$request_uri;
}

# Apex HTTPS
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name sitrifor.ru;

    root /var/www/sitrifor/public;
    index index.html;

    # ssl_certificate /etc/letsencrypt/live/sitrifor.ru/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/sitrifor.ru/privkey.pem;
    # include /etc/letsencrypt/options-ssl-nginx.conf;
    # ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    error_page 404 /404.html;

    gzip on;
    gzip_vary on;
    gzip_min_length 256;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        allow all;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 200s;
        proxy_send_timeout 200s;
    }

    location = /marketplace/ {
        return 301 /marketplace$is_args$args;
    }

    location = /marketplace {
        try_files /marketplace.html =404;
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # Canonical: strip trailing slash on product pages
    location ~ ^/marketplace/p/(.+)/$ {
        return 301 /marketplace/p/$1$is_args$args;
    }

    # SSR product pages from API
    location ~ ^/marketplace/p/ {
        proxy_pass http://127.0.0.1:8081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        add_header Cache-Control "no-cache, must-revalidate";
    }

    location = /news/ {
        return 301 /news$is_args$args;
    }

    location = /news {
        try_files /news.html =404;
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # SSR articles from API (title/canonical/body/JSON-LD without JS)
    location ~ ^/news/a/ {
        proxy_pass http://127.0.0.1:8081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        add_header Cache-Control "no-cache, must-revalidate";
    }

    location = /clients.html {
        return 301 /masters;
    }

    location = /clients {
        return 301 /masters;
    }

    location = /faq.html {
        return 301 /about#faq;
    }

    location = /faq {
        return 301 /about#faq;
    }

    location = /masters/ {
        return 301 /masters$is_args$args;
    }

    location = /about/ {
        return 301 /about$is_args$args;
    }

    location = /partners/ {
        return 301 /partners$is_args$args;
    }

    location = /exclusive/ {
        return 301 /exclusive$is_args$args;
    }

    location = /guides {
        return 301 /guides/$is_args$args;
    }

    location = /634 {
        return 301 /634/$is_args$args;
    }

    location = /tools/price-calculator {
        return 301 /tools/price-calculator/$is_args$args;
    }

    location = /privacy {
        return 301 /privacy/$is_args$args;
    }

    location = /support {
        try_files /support/index.html =404;
        add_header Cache-Control "no-cache, must-revalidate";
    }

    location = /support/ {
        try_files /support/index.html =404;
        add_header Cache-Control "no-cache, must-revalidate";
    }

    location = /lawyer {
        return 301 /lawyer/$is_args$args;
    }

    location = /lawyer/ {
        try_files /lawyer/index.html =404;
        add_header Cache-Control "no-cache, must-revalidate";
    }

    location /lawyer/ {
        try_files $uri $uri/ /lawyer/index.html;
        add_header Cache-Control "public, max-age=3600";
    }

    location ~ ^/(exclusive|about|masters|partners|faq|clients)\.html$ {
        return 301 /$1$is_args$args;
    }

    location /css/ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        try_files $uri =404;
    }

    location /js/ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        try_files $uri =404;
    }

    location /img/ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        try_files $uri =404;
    }

    location /fonts/ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        try_files $uri =404;
    }

    location = /404.html {
        internal;
    }

    location / {
        try_files $uri $uri.html $uri/ =404;
        add_header Cache-Control "no-cache, must-revalidate";
    }
}
